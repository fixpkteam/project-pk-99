name: One-time source formatting
on:
  push:
    branches:
      - fix/supabase-connected-auth-20261015
permissions:
  contents: write
jobs:
  format-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Format source
        run: dart format lib test integration_test
      - name: Commit formatted Dart files
        run: |
          if git diff --quiet -- lib test integration_test; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          git commit -m "style: format analyzer repairs"
          git push origin HEAD:fix/supabase-connected-auth-20261015
