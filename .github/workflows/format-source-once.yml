name: One-time Dart formatting repair
on:
  push:
    branches:
      - fix/supabase-connected-auth-20261015
permissions:
  contents: write
jobs:
  format-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-flutter
      - name: Format existing Dart files
        run: dart format lib test integration_test
      - name: Commit formatting fixes
        run: |
          if git diff --quiet -- lib test integration_test; then
            echo "Dart files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          git commit -m "style: apply Dart formatter to existing source"
          git push origin HEAD:fix/supabase-connected-auth-20261015
