name: fixpk
description: FixPK customer application — Phase 1 foundation.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  supabase_flutter: 2.18.2
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6
  file_picker: 13.1.0
  http: 1.6.0
  path_provider: 2.1.6
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/fixpk-logo.webp
    - assets/service-icons/
